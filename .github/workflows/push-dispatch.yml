name: Push dispatch (breaking news)

# Near-real-time web-push without needing a Vercel Pro cron: every ~10 minutes
# this pings the app's dispatch endpoint, which finds fresh high-impact stories
# and sends them to subscribers (deduped server-side). Works on any Vercel plan.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   PROD_URL     - production origin, e.g. https://xyzcrypto.io  (no trailing slash)
#   CRON_SECRET  - same value set in the Vercel env
# Until both are set, the job skips gracefully.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# If a run overruns, don't pile up.
concurrency:
  group: push-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger push dispatch
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PROD_URL / CRON_SECRET not set - skipping. Add them in repo Settings -> Secrets."
            exit 0
          fi
          code=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" --max-time 60 \
            "${PROD_URL%/}/api/push/dispatch?secret=${CRON_SECRET}")
          echo "HTTP ${code}"
          cat /tmp/dispatch.out 2>/dev/null || true
          echo ""
          # Never fail the schedule on a transient upstream hiccup.
          if [ "${code}" != "200" ]; then echo "::warning::dispatch returned ${code}"; fi
