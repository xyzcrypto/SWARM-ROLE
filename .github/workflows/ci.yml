name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time only (generate + next build don't connect). Real values
      # are set in the hosting provider.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci?pgbouncer=true"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the local + Vercel build environment. Next 14.2's build worker
          # can SIGSEGV on Node 20; Node 22 builds cleanly.
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Headroom for the Next build worker so a memory spike can't crash it.
          NODE_OPTIONS: --max-old-space-size=4096
