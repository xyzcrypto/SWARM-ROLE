name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time only (generate + next build don't connect). Real values
      # are set in the hosting provider.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci?pgbouncer=true"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
