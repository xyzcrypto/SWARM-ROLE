# Dependency updates. Recorded as done in the project history but the file was
# never actually committed, so nothing has been proposing patches.
#
# Limits are deliberately low: an unbounded Dependabot on a ~28-dependency
# project produces more noise than signal, and noise is how real security
# patches get ignored.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group the routine churn into one PR so security patches stand out on
    # their own. Dependabot always raises security updates separately.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: "production"
        update-types: ["patch"]
    ignore:
      # Major upgrades of these are migrations, not updates - they need a
      # planned branch, not an auto-PR. The Next 14 → 16 upgrade touched 31
      # files and needed a codemod.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
