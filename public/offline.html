<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · XYZ Crypto</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #12131c 0%, #05060a 60%);
    color: #e7e7ea; text-align: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 420px; }
  .logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; display: block; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.02em;
       background: linear-gradient(90deg,#f5d67b,#a8f0d2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0 0 22px; color: #9a9aa3; line-height: 1.6; font-size: 15px; }
  button {
    appearance: none; border: 1px solid rgba(245,214,123,.35);
    background: rgba(245,214,123,.12); color: #f5d67b;
    padding: 12px 22px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: rgba(245,214,123,.2); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef6b6b; margin-right:8px; vertical-align:middle; }
  .status { font-size: 12px; color:#6b6b74; margin-top: 18px; text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="XYZ Crypto" />
    <h1>You're offline</h1>
    <p>XYZ Crypto needs a connection for live market &amp; news data. Check your network - your last-viewed pages still work.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="status"><span class="dot"></span>No connection</div>
  </div>
</body>
</html>
